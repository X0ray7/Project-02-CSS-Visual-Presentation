<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex03</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Color Swatches:</h1>
    <div class="swatch-container">
      <div class="swatch named">Named (red)</div>
      <div class="swatch hex">HEX (#3498db)</div>
      <div class="swatch rgb">RGB (230, 126, 34)</div>
      <div class="swatch rgba">RGBA (155, 89, 182, 0.5)</div>
    </div>
    <hr>
    <h2>Opacity vs RGBA Comparison:</h2>
    <div class="comparison-container">
      <div class="box opacity-box"><p>
        Opacity: 0.5 (Text and background both become transparent)
      </p></div>
      <div class="box rgba-box"><p>
        RGBA: 0.5 (Only background is transparent, text remains solid)
      </p></div>
    </div>
  </body>
  </html>
