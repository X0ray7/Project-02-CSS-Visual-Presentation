<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex04</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Box Module Comparison</h1>
    <div class="container">
      <div class="box container-box">
        <h2>Content-Box</h2>
        <p>Width + Padding + Border = Total Width (expands outside)</p>
      </div>
      <div class="box border-box">
        <h3>Border-box</h3>
        <p>Width includes Padding and Border inside the declared size</p>
      </div>
    </div>
  </body>
  </html>
